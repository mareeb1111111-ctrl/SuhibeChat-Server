version: '3.8'

services:
  fastapi_app:
    build: .
    container_name: suhibechat_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # ربط قاعدة البيانات والملفات المرفوعة والسجلات لضمان عدم ضياعها
      - ./chat_server.db:/app/chat_server.db
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      # استخدام tmpfs لمجلد tmp لتجنب الكتابة على نظام الملفات
      - type: tmpfs
        target: /tmp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true # جعل نظام الملفات للقراءة فقط كإجراء أمني (ما عدا الـ volumes)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
